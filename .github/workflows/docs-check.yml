name: Docs check

permissions:
  contents: write

on:
  pull_request:
    paths:
      - "README.md"
      - "AGENTS.md"
      - "docs/**"
      - "data/**"
      - "scripts/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".gitattributes"
      - ".gitignore"
      - ".dockerignore"
      - "Dockerfile"
      - "compose.yml"
      - ".github/workflows/docs-check.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "AGENTS.md"
      - "docs/**"
      - "data/**"
      - "scripts/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".gitattributes"
      - ".gitignore"
      - ".dockerignore"
      - "Dockerfile"
      - "compose.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/rl-cf-002-access-catalog

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.16.0"
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: pnpm

      - name: Install fixed dependencies
        run: |
          python -m pip install --requirement requirements-docs.txt
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Generate documentation and portables
        run: |
          python scripts/erasmushomes_panel.py check
          python scripts/docs_pipeline.py generate

      - name: Commit synchronized generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/javascripts/mermaid.min.js docs/downloads
          if git diff --cached --quiet; then
            echo "Generated files already synchronized"
          else
            git commit -m "docs: regenerate portable artifacts"
            git push origin HEAD:fix/rl-cf-002-access-catalog
          fi

      - name: Build static runtime image
        run: docker build --tag infra-replicant-docs:test .

      - name: Smoke-test Nginx and downloads
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f infra-replicant-docs-test >/dev/null 2>&1 || true' EXIT
          docker run --detach --name infra-replicant-docs-test --publish 127.0.0.1:8082:80 infra-replicant-docs:test
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8082/ >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8082/ >/dev/null
          curl --fail --silent --output /tmp/Replicant-Lab.html http://127.0.0.1:8082/downloads/Replicant-Lab.html
          curl --fail --silent --output /tmp/Replicant-Lab.pdf http://127.0.0.1:8082/downloads/Replicant-Lab.pdf
          cmp docs/downloads/Replicant-Lab.html /tmp/Replicant-Lab.html
          cmp docs/downloads/Replicant-Lab.pdf /tmp/Replicant-Lab.pdf
          curl --fail --silent --show-error --head http://127.0.0.1:8082/downloads/erasmushomes/Roadmap_ErasmusHomes_MVP_Diciembre_2026.pdf | grep -i '^Content-Type: application/pdf'
          ! grep -Eqi 'livereload|wss?://|localhost:' /tmp/Replicant-Lab.html
          for source in docs/downloads/apps/*; do
            relative="${source#docs/}"
            target="/tmp/$(basename "$source")"
            curl --fail --silent --output "$target" "http://127.0.0.1:8082/$relative"
            cmp "$source" "$target"
          done

      - name: Upload portable documentation
        uses: actions/upload-artifact@v4
        with:
          name: replicant-lab-portables
          path: |
            docs/downloads/Replicant-Lab.html
            docs/downloads/Replicant-Lab.pdf
            docs/downloads/apps/
          if-no-files-found: error
