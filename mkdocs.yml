site_name: Replicant Lab
site_description: Documentación viva de infraestructura, hosts, red, despliegues y operación

nav:
  - Inicio: index.md
  - Arquitectura: arquitectura.md
  - Evolución: fases/index.md
  - Hosts:
      - Replicant: hosts/replicant.md
      - Nexus: hosts/nexus.md
      - DigitalOcean: hosts/digitalocean.md
      - GitHub: hosts/github.md
  - Red:
      - Visión general: red/overview.md
      - Inventario provisional: red/inventario.md
  - Despliegue:
      - Modelos: despliegue/modelos.md
      - Git: despliegue/git.md
      - Docker: despliegue/docker.md
  - Operación:
      - SSH: operacion/ssh.md
      - Comandos útiles: operacion/comandos-utiles.md
      - Mantenimiento: operacion/mantenimiento.md
  - Descargas: descargas.md
  - Pendientes: pendientes-codex.md
  - Aplicaciones:
      - Índice: aplicaciones/index.md
      - App Launch: aplicaciones/app-launch.md
      - Salones AV: aplicaciones/salones-av.md
      - Reserva-Pistas-UTP: aplicaciones/reserva-pistas-utp.md
      - Consumos Cupra: aplicaciones/consumos-cupra.md
      - CV de Raúl: aplicaciones/cv-raul.md
      - Control de Red: aplicaciones/control-red.md
      - Cartera Estratégica: aplicaciones/cartera-estrategica.md
      - Replicant Lab: aplicaciones/replicant-lab.md
  - Autodocumentación: autodocumentacion.md
  - Decisiones: decisiones.md
  - Change Log:
      - Índice: cambios/index.md
      - 13 de agosto de 2026: cambios/2026-08-13.md
      - 9 de agosto de 2026: cambios/2026-08-09.md
      - 8 de agosto de 2026: cambios/2026-08-08.md

theme:
  name: material
  language: es
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

extra_javascript:
  - javascripts/mermaid.min.js
  - javascripts/mermaid-init.js
  - javascripts/downloads.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables

extra:
  generator: false
